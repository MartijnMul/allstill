# oapi-codegen turns what is served of the API description into Go here, as a named
# list, as a tag can hold operations that are not served yet. `make generate` runs
# it; `make check` fails when the generated code is out of date. A new operation
# goes in ../apiclient/oapi-codegen.yaml too, and in the table in internal/web/api.go.
package: api
generate:
  std-http-server: true
  strict-server: true
  models: true
output: api.gen.go
output-options:
  include-operation-ids: [getProbeChecks, postProbeRuns, getMe, endThisToken]
