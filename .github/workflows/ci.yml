# SPDX-License-Identifier: AGPL-3.0-only
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: make check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make check

  release-build:
    name: Release build
    # The release configuration still builds: every platform, the packages and
    # the images, without signing or publishing anything.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.2
          args: release --snapshot --clean --skip=sign,sbom
      - name: The image starts
        run: |
          image="ghcr.io/martijnmul/allstill:$(jq -r .version dist/metadata.json)-amd64"
          docker run --rm "$image" version
          docker rmi "$image" # so the next test cannot pass on this one
      - name: The release candidate's configuration builds too
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.2
          args: release --snapshot --clean --config .goreleaser-rc.yaml
      - name: Its image starts
        run: |
          docker run --rm "ghcr.io/martijnmul/allstill:$(jq -r .version dist/metadata.json)-amd64" version

  workflows:
    name: Workflow audit
    # zizmor checks the workflows for what lets an outsider into a run:
    # unpinned actions, broad permissions, injection, cache poisoning.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: zizmor
        run: >
          docker run --rm -v "$PWD:/repo:ro"
          ghcr.io/zizmorcore/zizmor:1.30.1@sha256:a2eb396d886c053073405c7a980f2139ba2248ec172243cfa3841e57196e8101
          --offline /repo/.github/workflows

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks
        run: >
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --redact --verbose --no-banner

  private-terms:
    name: Private terms
    # The backstop for the local git hooks: every commit's content, file names
    # and message, checked against the terms in the DENYLIST secret. It prints
    # commit hashes only, never a term, so the log stays safe to publish.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan the history
        shell: bash
        env:
          DENYLIST: ${{ secrets.DENYLIST }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          terms=$(mktemp)
          printf '%s\n' "${DENYLIST:-}" | tr -d '\r' | { grep -v -e '^#' -e '^[[:space:]]*$' || true; } > "$terms"
          if [ ! -s "$terms" ]; then
            if [ "$EVENT" = "pull_request" ]; then
              echo "::notice::No DENYLIST secret for this pull request (a fork or Dependabot); skipped."
              exit 0
            fi
            echo "::error::The DENYLIST secret is missing or empty; the history cannot be checked."
            exit 1
          fi
          found=0
          for c in $(git rev-list --all); do
            # Write to a file first: grep -q would stop reading early and, with
            # pipefail, hide the rest of a large commit.
            git -c core.quotePath=false show --text --format=%B --name-only "$c" > show.txt
            git show --text --no-ext-diff --no-textconv --format= -U0 "$c" >> show.txt
            if grep -i -F -f "$terms" show.txt > /dev/null; then
              echo "::error::commit $c contains a private term"
              found=1
            fi
          done
          rm -f "$terms" show.txt
          exit $found

  identity:
    name: Commit identity
    # Every author and committer uses a GitHub noreply address. Prints commit
    # hashes only, never an address.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check every commit
        shell: bash
        run: |
          set -euo pipefail
          found=0
          while read -r c author committer; do
            for e in "$author" "$committer"; do
              case "$e" in
                *@users.noreply.github.com|noreply@github.com) ;;
                *) echo "::error::commit $c is not by a noreply address"; found=1 ;;
              esac
            done
          done < <(git log --all --format='%H %ae %ce')
          exit $found
