# SPDX-License-Identifier: Apache-2.0
openapi: 3.1.1
info:
  title: Allstill API
  version: 0.14.0
  summary: Pings from jobs, and the status of checks and their runs.
  description: |
    What jobs, people and programs use, in one document.

    **Pings** (tag `Ping`) are what jobs send. They follow Healthchecks.io, so a job
    moves over by changing the base URL. A check's ping URL is its credential: it
    can only ping that check. Ping endpoints answer in plain text and never need
    a token.

    **The JSON API** (all other tags) is served under `/api/v1` and needs a bearer
    token: an OAuth access token of a person signed in through the CLI or, once they
    are served, an API key of a project. What a token may do is its scope (`read`,
    `manage`) combined with the caller's role in each project (viewer, editor,
    owner). A request never returns data from a project the caller is not in. A
    browser's cookie never counts here, so a web page cannot use someone's session.

    **Signing in** (tag `OAuth`) is the device grant of RFC 8628, served at the root.

    What is not served yet says so at its operation.

    Conventions: JSON field names are `snake_case`; times are RFC 3339 in UTC;
    durations are whole seconds; identifiers are opaque strings; a field without a
    value is left out rather than sent as `null`; errors are Problem Details
    (RFC 9457); lists are paged with an opaque cursor, at most 200 to a page.
  license:
    name: Apache-2.0
    identifier: Apache-2.0

servers:
  - url: https://{host}/api/v1
    description: The JSON API of an installation
    variables:
      host:
        default: allstill.example.com
        description: The host name of your installation.

tags:
  - name: Ping
    description: Sent by jobs. Compatible with Healthchecks.io.
  - name: Probe
    description: Used by `allstill probe`, which runs checks inside a network the server cannot reach.
  - name: Account
    description: Who is asking.
  - name: OAuth
    description: Signing in from a command line, with a code someone approves with a passkey in any browser. Served at the root, like the pings.
  - name: Status
    description: One snapshot of everything the caller can see, for reading first.
  - name: Projects
    description: The unit of access; each has members, keys and alert routing.
  - name: Checks
    description: What is watched, and how it is judged.
  - name: Probes
    description: The programs that run checks inside a network the server cannot reach.
  - name: Keys
    description: A project's keys, for scripts. Only an owner of the project manages them, with a person's sign-in.
  - name: Log
    description: What happened, when and by whom, as far as the caller may know.
  - name: Events
    description: A live stream of changes.
  - name: Alerts
    description: Where a person is alerted, what they were sent, and whether alerts are sent at all.
  - name: Health
    description: Whether Allstill can alert, for a monitor outside it. Served at the root, like the pings.

security:
  - bearer: [read]

paths:

  # Pings. Every GET also answers HEAD. The query parameters and responses are
  # shared through YAML anchors, defined on the first operation.

  /ping/{check_uuid}:
    servers: &ping-servers
      - url: https://{host}
        description: Ping ingest; may be the same host as the API
        variables:
          host:
            default: ping.example.com
            description: The host name your installation receives pings on.
    parameters:
      - $ref: '#/components/parameters/CheckUuid'
    get:
      tags: [Ping]
      operationId: pingSuccess
      summary: Report that the job ran and succeeded
      security: []
      parameters: &ping-query
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/Values'
        - $ref: '#/components/parameters/ValuesHeader'
      responses: &ping-responses
        '200': {$ref: '#/components/responses/PingOk'}
        '400': {$ref: '#/components/responses/PingBadRequest'}
        '404': {$ref: '#/components/responses/PingNotFound'}
    post:
      tags: [Ping]
      operationId: pingSuccessWithBody
      summary: Report that the job ran and succeeded, with output
      security: []
      parameters: *ping-query
      requestBody:
        $ref: '#/components/requestBodies/PingBody'
      responses: *ping-responses

  /ping/{check_uuid}/start:
    servers: *ping-servers
    parameters:
      - $ref: '#/components/parameters/CheckUuid'
    get:
      tags: [Ping]
      operationId: pingStart
      summary: Report that the job started
      description: |
        Starts a run. The next success, failure or exit status with the same `rid`
        (or, without one, the next of them) finishes it and records the run time.
        A run that is not finished within the check's grace period after its
        expected end is a failure. A start that arrives after its end joins that
        run instead: see `rid`.
      security: []
      parameters: *ping-query
      responses: *ping-responses
    post:
      tags: [Ping]
      operationId: pingStartWithBody
      summary: Report that the job started, with output
      description: |
        Starts a run. The next success, failure or exit status with the same `rid`
        (or, without one, the next of them) finishes it and records the run time.
        A run that is not finished within the check's grace period after its
        expected end is a failure. A start that arrives after its end joins that
        run instead: see `rid`.
      security: []
      parameters: *ping-query
      requestBody:
        $ref: '#/components/requestBodies/PingBody'
      responses: *ping-responses

  /ping/{check_uuid}/fail:
    servers: *ping-servers
    parameters:
      - $ref: '#/components/parameters/CheckUuid'
    get:
      tags: [Ping]
      operationId: pingFail
      summary: Report that the job failed
      security: []
      parameters: *ping-query
      responses: *ping-responses
    post:
      tags: [Ping]
      operationId: pingFailWithBody
      summary: Report that the job failed, with output
      security: []
      parameters: *ping-query
      requestBody:
        $ref: '#/components/requestBodies/PingBody'
      responses: *ping-responses

  /ping/{check_uuid}/log:
    servers: *ping-servers
    parameters:
      - $ref: '#/components/parameters/CheckUuid'
    get:
      tags: [Ping]
      operationId: pingLog
      summary: Add to the log without changing the check's state
      security: []
      parameters: *ping-query
      responses: *ping-responses
    post:
      tags: [Ping]
      operationId: pingLogWithBody
      summary: Add to the log without changing the check's state, with output
      security: []
      parameters: *ping-query
      requestBody:
        $ref: '#/components/requestBodies/PingBody'
      responses: *ping-responses

  # One path, two meanings: OpenAPI does not allow two paths that differ only in
  # their parameter names.

  /ping/{key}/{exit_status_or_slug}:
    servers: *ping-servers
    parameters:
      - name: key
        in: path
        required: true
        description: |
          A check UUID, or a project's ping key. The server tells them apart by
          their form: a UUID has hyphens in the UUID positions, a ping key never does.
        schema:
          type: string
          minLength: 22
          maxLength: 36
      - name: exit_status_or_slug
        in: path
        required: true
        description: |
          After a check UUID: the job's exit status, `0` for success and `1` to `255`
          for failure. After a ping key: the slug of a check in that project, and
          the ping reports success.
        schema:
          type: string
          pattern: '^[a-z0-9][a-z0-9_-]{0,99}$'
    get:
      tags: [Ping]
      operationId: pingExitStatusOrSlug
      summary: Report an exit status by UUID, or success by slug
      security: []
      parameters: &ping-query-slug
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/Values'
        - $ref: '#/components/parameters/ValuesHeader'
        - $ref: '#/components/parameters/Create'
      responses: &ping-responses-slug
        '200': {$ref: '#/components/responses/PingOk'}
        '201': {$ref: '#/components/responses/PingCreated'}
        '400': {$ref: '#/components/responses/PingBadRequest'}
        '404': {$ref: '#/components/responses/PingNotFound'}
        '429': {$ref: '#/components/responses/PingRateLimited'}
    post:
      tags: [Ping]
      operationId: pingExitStatusOrSlugWithBody
      summary: Report an exit status by UUID, or success by slug, with output
      security: []
      parameters: *ping-query-slug
      requestBody:
        $ref: '#/components/requestBodies/PingBody'
      responses: *ping-responses-slug

  # Pings by project ping key and check slug

  /ping/{ping_key}/{slug}/start:
    servers: *ping-servers
    parameters:
      - $ref: '#/components/parameters/PingKey'
      - $ref: '#/components/parameters/Slug'
    get:
      tags: [Ping]
      operationId: pingSlugStart
      summary: Report that the job started, by slug
      security: []
      parameters: *ping-query-slug
      responses: *ping-responses-slug
    post:
      tags: [Ping]
      operationId: pingSlugStartWithBody
      summary: Report that the job started, by slug, with output
      security: []
      parameters: *ping-query-slug
      requestBody:
        $ref: '#/components/requestBodies/PingBody'
      responses: *ping-responses-slug

  /ping/{ping_key}/{slug}/fail:
    servers: *ping-servers
    parameters:
      - $ref: '#/components/parameters/PingKey'
      - $ref: '#/components/parameters/Slug'
    get:
      tags: [Ping]
      operationId: pingSlugFail
      summary: Report that the job failed, by slug
      security: []
      parameters: *ping-query-slug
      responses: *ping-responses-slug
    post:
      tags: [Ping]
      operationId: pingSlugFailWithBody
      summary: Report that the job failed, by slug, with output
      security: []
      parameters: *ping-query-slug
      requestBody:
        $ref: '#/components/requestBodies/PingBody'
      responses: *ping-responses-slug

  /ping/{ping_key}/{slug}/log:
    servers: *ping-servers
    parameters:
      - $ref: '#/components/parameters/PingKey'
      - $ref: '#/components/parameters/Slug'
    get:
      tags: [Ping]
      operationId: pingSlugLog
      summary: Add to the log by slug, without changing the check's state
      security: []
      parameters: *ping-query-slug
      responses: *ping-responses-slug
    post:
      tags: [Ping]
      operationId: pingSlugLogWithBody
      summary: Add to the log by slug, without changing the check's state, with output
      security: []
      parameters: *ping-query-slug
      requestBody:
        $ref: '#/components/requestBodies/PingBody'
      responses: *ping-responses-slug

  /ping/{ping_key}/{slug}/{exit_status}:
    servers: *ping-servers
    parameters:
      - $ref: '#/components/parameters/PingKey'
      - $ref: '#/components/parameters/Slug'
      - $ref: '#/components/parameters/ExitStatus'
    get:
      tags: [Ping]
      operationId: pingSlugExitStatus
      summary: Report the job's exit status, by slug
      security: []
      parameters: *ping-query-slug
      responses: *ping-responses-slug
    post:
      tags: [Ping]
      operationId: pingSlugExitStatusWithBody
      summary: Report the job's exit status, by slug, with output
      security: []
      parameters: *ping-query-slug
      requestBody:
        $ref: '#/components/requestBodies/PingBody'
      responses: *ping-responses-slug

  # Signing in, outside /api/v1 like the pings. A standard defines these, so they are
  # left out of the generated handlers.

  /oauth/device_authorization:
    servers:
      - url: https://{host}
        description: The installation itself, outside `/api/v1`
        variables:
          host:
            default: allstill.example.com
    post:
      tags: [OAuth]
      operationId: requestDeviceCode
      summary: Ask for a code for someone to approve (RFC 8628)
      description: |
        Anyone can ask, and asking writes nothing. It is limited over the whole
        installation, and `verification_uri_complete` is left out on purpose: the code
        is always typed, so a link cannot arrive with it filled in.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [client_id]
              properties:
                client_id:
                  type: string
                  const: allstill
                scope:
                  description: Left out, it means `manage`.
                  type: string
                  enum: [read, manage]
                device_name:
                  description: What this machine is called, shown as its own claim to whoever approves it, and on their list of sign-ins.
                  type: string
                  maxLength: 100
      responses:
        '200':
          description: The code to show, and how to wait for it.
          content:
            application/json:
              schema:
                type: object
                required: [device_code, user_code, verification_uri, expires_in, interval]
                properties:
                  device_code: {type: string}
                  user_code:
                    type: string
                    examples: [WDJB-MJHT]
                  verification_uri: {type: string, format: uri}
                  expires_in:
                    type: integer
                    format: int64
                  interval:
                    type: integer
                    format: int64
        '400': {$ref: '#/components/responses/OAuthError'}
        '401': {$ref: '#/components/responses/OAuthError'}
        '429':
          description: Too many are being asked for. Try again after a while.
          headers:
            Retry-After:
              description: Seconds to wait.
              schema: {type: integer}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OAuthError'}

  /oauth/token:
    servers:
      - url: https://{host}
        description: The installation itself, outside `/api/v1`
        variables:
          host:
            default: allstill.example.com
    post:
      tags: [OAuth]
      operationId: requestToken
      summary: Ask what became of a code, and get its token once approved (RFC 8628)
      description: |
        Poll no more often than the `interval` given. The answer to a code that was
        approved is given once. There is no refresh token: a sign-in stays good while it
        is used, for up to a year, and each request reads whether it still is.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [client_id, grant_type, device_code]
              properties:
                client_id:
                  type: string
                  const: allstill
                grant_type:
                  type: string
                  const: urn:ietf:params:oauth:grant-type:device_code
                device_code: {type: string}
      responses:
        '200':
          description: Approved. Keep the token; only its hash is stored.
          content:
            application/json:
              schema:
                type: object
                required: [access_token, token_type, scope]
                properties:
                  access_token: {type: string}
                  token_type:
                    type: string
                    const: Bearer
                  scope:
                    type: string
                    enum: [read, manage]
        '400': {$ref: '#/components/responses/OAuthError'}
        '401': {$ref: '#/components/responses/OAuthError'}

  # Whether Allstill can alert, outside /api/v1 like the pings.

  /health:
    servers:
      - url: https://{host}
        description: The installation itself, outside `/api/v1`
        variables:
          host:
            default: allstill.example.com
            description: The host name of your installation.
    get:
      tags: [Health]
      operationId: getHealth
      summary: Whether Allstill can alert, for a monitor outside it
      description: |
        Watch this from somewhere other than Allstill's own host. It answers 503
        when the sender has fallen more than two minutes behind, the database
        cannot be read, or the server is offline for the checks it runs (its
        canary does not answer, so it cannot judge them). It says nothing about
        any check, so it needs no token.
      security: []
      responses:
        # There is no 4xx: it takes nothing from the caller (lint-ignored).
        '200':
          description: Allstill keeps up.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Health'}
        '503':
          description: Allstill is behind, cannot read its database, or is offline for its checks.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Health'}

  # The JSON API

  /me:
    get:
      tags: [Account]
      operationId: getMe
      summary: The signed-in person, or the API key, and the projects it can see
      description: |
        A sign-in with the scope `read` acts as a viewer in every project its person
        can see, also for an administrator, and is described as such here.
      responses:
        '200':
          description: Who is asking, and with which role in which project.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Me'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /me/token:
    delete:
      tags: [Account]
      operationId: endThisToken
      summary: End the sign-in this request came through
      description: |
        What `allstill logout` does. It stops working at once. A sign-in with the scope
        `read` can do this too, and it is all it can end: other sign-ins are ended under
        **Devices** in the dashboard.
      responses:
        '204':
          description: It has ended.
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /status:
    get:
      tags: [Status]
      operationId: getStatus
      summary: Everything the caller can see, in one snapshot
      description: |
        Read this first: how many checks are in each state, per project and in all, and
        every check that needs attention, with why. It answers 200 however bad things
        are, as it reports state and not its own health.
      responses:
        '200':
          description: The current status.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Status'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /log:
    get:
      tags: [Log]
      operationId: listLog
      summary: What happened, newest first, as far as the caller may know
      description: |
        The same record, under the same rules for each reader, as the dashboard's **Log**.
        It holds facts, not sentences. New `kind`s will come: a client says what kind of
        entry it does not know.
      parameters:
        - name: project_id
          in: query
          schema: {$ref: '#/components/schemas/Id'}
        - name: check_id
          in: query
          schema: {$ref: '#/components/schemas/Id'}
        - name: name
          in: query
          description: What an entry is about, by its exact name, ignoring case. This also finds a check that was deleted.
          schema: {type: string}
        - name: person_id
          in: query
          schema: {$ref: '#/components/schemas/Id'}
        - name: what
          in: query
          schema:
            type: string
            enum: [happened, done, reached, signins]
        - name: late
          in: query
          description: Also show a check going late and back, which a job that pings just after its time does on every run.
          schema: {type: boolean, default: false}
        - name: group
          in: query
          description: What one entry stands for, by its `group`.
          schema: {type: string}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of the log.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LogPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /probes:
    get:
      tags: [Probes]
      operationId: listProbes
      summary: The probes that serve projects the caller may edit
      description: Someone who may only look is not told of a project's probes.
      responses:
        '200':
          description: The probes.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProbeList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /me/channels:
    get:
      tags: [Alerts]
      operationId: listMyChannels
      summary: 'Not served yet. Where the signed-in person is alerted'
      description: Needs a person's token; an API key gets 403. A channel never shows a subscription's endpoint or keys (ADR 0003).
      responses:
        '200':
          description: The person's channels.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/Channel'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /me/channels/webpush:
    post:
      tags: [Alerts]
      operationId: savePushSubscription
      summary: 'Not served yet. Add this device, or send its subscription again'
      description: |
        Needs a person's token with the `manage` scope. The same subscription sent
        again keeps its channel and its confirmation; other keys for the same
        endpoint, or another person, replace it, and it must be confirmed again.
      security:
        - bearer: [manage]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PushSubscription'}
      responses:
        '200':
          description: The device's channel.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Channel'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /me/channels/email:
    post:
      tags: [Alerts]
      operationId: addEmailChannel
      summary: 'Not served yet. Add an email address, and send it a test'
      description: |
        Needs a person's token with the `manage` scope. The address gets alerts once
        the link in its test message was opened, signed in. The same address again
        keeps its channel. At most three per person.
      security:
        - bearer: [manage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [address]
              properties:
                address: {type: string, format: email, maxLength: 254}
      responses:
        '200':
          description: The address's channel.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Channel'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409':
          description: The server cannot send email; its administrator has not set it up.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '429':
          description: The person has as many addresses as they may.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}

  /me/channels/{channel_id}:
    parameters:
      - $ref: '#/components/parameters/ChannelId'
    delete:
      tags: [Alerts]
      operationId: deleteMyChannel
      summary: 'Not served yet. Stop alerting a device'
      security:
        - bearer: [manage]
      responses:
        '204': {description: The channel is gone.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /me/channels/{channel_id}/test:
    parameters:
      - $ref: '#/components/parameters/ChannelId'
    post:
      tags: [Alerts]
      operationId: testMyChannel
      summary: 'Not served yet. Send a test message, even in shadow mode'
      description: |
        Opening the test message on the device, or the link in it signed in, confirms
        the channel; alerts go only to confirmed channels. At most one test a minute
        to a channel, and ten a day per person, as a test can go to any address.
      security:
        - bearer: [manage]
      responses:
        '202': {description: The test message is on its way.}
        '429':
          description: Too soon after the last test, or too many today.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /me/messages:
    get:
      tags: [Alerts]
      operationId: listMyMessages
      summary: 'Not served yet. What the signed-in person was sent, or in shadow mode would have been, newest first'
      description: Needs a person's token; an API key gets 403.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of messages.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MessagePage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /settings/alerts:
    get:
      tags: [Alerts]
      operationId: getAlertSettings
      summary: 'Not served yet. Whether alerts are sent or only recorded'
      responses:
        '200':
          description: The installation's alert settings.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AlertSettings'}
        '401': {$ref: '#/components/responses/Unauthorized'}
    patch:
      tags: [Alerts]
      operationId: setAlertSettings
      summary: 'Not served yet. Switch shadow mode on or off'
      description: |
        Needs a workspace administrator's token with the `manage` scope. Incidents
        opened in shadow mode are not alerted when it is switched off; the next
        digest lists them. An installation started with `-shadow` stays in shadow
        mode whatever this says.
      security:
        - bearer: [manage]
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: {$ref: '#/components/schemas/AlertSettings'}
      responses:
        '200':
          description: The settings now.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AlertSettings'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /projects:
    get:
      tags: [Projects]
      operationId: listProjects
      summary: The projects the caller can see
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of projects.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProjectPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /projects/{project_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Projects]
      operationId: getProject
      summary: One project
      responses:
        '200':
          description: The project.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Project'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /projects/{project_id}/checks:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Checks]
      operationId: listChecks
      summary: The checks of a project
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of checks.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CheckPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
    post:
      tags: [Checks]
      operationId: createCheck
      summary: Create a check
      description: |
        Needs the `manage` scope and the editor role in the project. A job's check has
        one schedule a day with an hour's grace unless it says otherwise, and one that
        Allstill runs itself is run each minute. An address it runs from the server
        must be one the server may reach, and is tried once, as the form does.
      security:
        - bearer: [manage]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CheckInput'}
      responses:
        '201':
          description: The check, with its ping URL if jobs ping it, and what a try found if Allstill runs it.
          headers:
            Location:
              description: The URL of the new check.
              required: true
              schema: {type: string, format: uri}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CheckCreated'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /checks/{check_id}:
    parameters:
      - $ref: '#/components/parameters/CheckId'
    get:
      tags: [Checks]
      operationId: getCheck
      summary: One check
      responses:
        '200':
          description: The check. An HTTP check's `url` and `location` are whole only for someone who may see them, and a ping URL is never here (see `getPingUrl`).
          headers:
            ETag:
              description: The version of the check, for `If-Match`.
              required: true
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Check'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
    patch:
      tags: [Checks]
      operationId: updateCheck
      summary: Change a check
      description: |
        Only the fields sent change. Send `If-Match` with the ETag you read to avoid
        overwriting someone else's change. Needs the `manage` scope and the editor role.
        A changed address must be one the server may reach, and is tried once.
      security:
        - bearer: [manage]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CheckPatch'}
      responses:
        '200':
          description: The changed check, with what a try found if its address changed.
          headers:
            ETag:
              description: The version of the check, for `If-Match`.
              required: true
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CheckTried'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
    delete:
      tags: [Checks]
      operationId: deleteCheck
      summary: Delete a check with its runs
      description: Needs the `manage` scope and the editor role. A probe's own check stays.
      security:
        - bearer: [manage]
      responses:
        '204':
          description: Deleted.
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /checks/{check_id}/pause:
    parameters:
      - $ref: '#/components/parameters/CheckId'
    post:
      tags: [Checks]
      operationId: pauseCheck
      summary: Pause a check until it is resumed or pinged
      description: Needs the `manage` scope and the editor role. A probe's own check stays.
      security:
        - bearer: [manage]
      responses:
        '200':
          description: The paused check.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Check'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /checks/{check_id}/resume:
    parameters:
      - $ref: '#/components/parameters/CheckId'
    post:
      tags: [Checks]
      operationId: resumeCheck
      summary: Resume a paused check
      description: Needs the `manage` scope and the editor role. A check that is not paused stays as it is.
      security:
        - bearer: [manage]
      responses:
        '200':
          description: The check.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Check'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /checks/{check_id}/move:
    parameters:
      - $ref: '#/components/parameters/CheckId'
    post:
      tags: [Checks]
      operationId: moveCheck
      summary: Move a check to another project
      description: Needs the `manage` scope and the editor role in both projects. Its runs and output go with it.
      security:
        - bearer: [manage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id]
              properties:
                project_id: {$ref: '#/components/schemas/Id'}
      responses:
        '200':
          description: The moved check.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Check'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /checks/{check_id}/ping-url:
    parameters:
      - $ref: '#/components/parameters/CheckId'
    get:
      tags: [Checks]
      operationId: getPingUrl
      summary: The check's ping URL
      description: Needs the `manage` scope and the editor role.
      security:
        - bearer: [manage]
      responses:
        '200':
          description: Its ping URL.
          content:
            application/json:
              schema:
                type: object
                required: [ping_url]
                properties:
                  ping_url: {type: string, format: uri}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
    post:
      tags: [Checks]
      operationId: rotatePingUrl
      summary: Replace the check's ping URL
      description: |
        The old URL stops working at once. Needs the `manage` scope and the editor
        role.
      security:
        - bearer: [manage]
      responses:
        '200':
          description: The check with its new ping URL.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CheckWithPingUrl'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /checks/{check_id}/runs:
    parameters:
      - $ref: '#/components/parameters/CheckId'
    get:
      tags: [Checks]
      operationId: listRuns
      summary: The runs of a check, newest first
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of runs.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /projects/{project_id}/keys:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [Keys]
      operationId: createKey
      summary: Make a key for a project
      description: |
        Needs a person's sign-in with the `manage` scope, as an owner of the project.
        With `read` the key acts as a viewer of this project, and with
        `manage` as an editor, and it reaches nothing else. It is shown here, once.
      security:
        - bearer: [manage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scope]
              properties:
                name: {type: string, minLength: 1, maxLength: 100}
                scope: {$ref: '#/components/schemas/Scope'}
      responses:
        '201':
          description: The key, with its value.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiKeyMade'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /keys:
    get:
      tags: [Keys]
      operationId: listKeys
      summary: The keys of a project, or of all the caller owns
      description: |
        Needs a person's sign-in, as an owner of the project. Who made a key reads as
        in the log, and which sign-in only for an owner of the project's team or the
        one who made it. A key's value is never here.
      parameters:
        - name: project_id
          in: query
          description: Only this project. Without it, every project the caller owns.
          schema: {$ref: '#/components/schemas/Id'}
      responses:
        '200':
          description: The keys.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiKeyList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /keys/{key_id}:
    parameters:
      - name: key_id
        in: path
        required: true
        schema: {$ref: '#/components/schemas/Id'}
    delete:
      tags: [Keys]
      operationId: revokeKey
      summary: Revoke a key
      description: It stops working on its next request. Needs a person's sign-in with the `manage` scope, as an owner of its project.
      security:
        - bearer: [manage]
      responses:
        '204':
          description: Revoked.
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /probe/checks:
    parameters:
      - $ref: '#/components/parameters/ProbeProtocol'
    get:
      tags: [Probe]
      operationId: getProbeChecks
      summary: The checks this probe runs
      description: |
        A probe polls this every 30 seconds with its own key, and sends the `ETag` it
        last got back in `If-None-Match`. Settings are returned whole, URLs with their
        tokens too: the checks are the probe's to run.
      security:
        - probeKey: []
      parameters:
        - name: If-None-Match
          in: header
          schema: {type: string}
      responses:
        '200':
          description: Its checks.
          headers:
            ETag:
              description: Changes when its checks do.
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProbeChecks'}
        '304':
          description: Its checks did not change.
        '400': {$ref: '#/components/responses/ProbeProblem'}
        '401': {$ref: '#/components/responses/ProbeProblem'}
        '426': {$ref: '#/components/responses/ProbeProblem'}
        '429': {$ref: '#/components/responses/ProbeProblem'}

  /probe/runs:
    parameters:
      - $ref: '#/components/parameters/ProbeProtocol'
    post:
      tags: [Probe]
      operationId: postProbeRuns
      summary: Report attempts, and that the probe is alive
      description: |
        A probe posts at least every 30 seconds, with an empty list when it has no runs:
        every post pings the probe's own check, which goes down after 3 minutes without
        one, while the checks it runs become unknown. The server stamps each run with
        its own clock, ignores an id it has seen, and ignores a run that is not valid,
        for a check that is not this probe's, made under settings the check no longer
        has, or older than the last it applied for that check. A batch can be sent again safely after a lost answer.

        A probe whose clock is more than a minute off the server's cannot be trusted
        with certificates: its runs count as not judged, so its checks become unknown
        until the clock is set right.
      security:
        - probeKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProbeRunBatch'}
      responses:
        '200':
          description: What became of the batch.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProbeRunResult'}
        '400': {$ref: '#/components/responses/ProbeProblem'}
        '401': {$ref: '#/components/responses/ProbeProblem'}
        '413': {$ref: '#/components/responses/ProbeProblem'}
        '426': {$ref: '#/components/responses/ProbeProblem'}
        '429': {$ref: '#/components/responses/ProbeProblem'}

  /events:
    get:
      tags: [Events]
      operationId: streamEvents
      summary: 'Not served yet. A live stream of changes, as Server-Sent Events'
      description: |
        Every change the caller may see, in order. Each event has an `id` (its
        position), an `event` name equal to the `type` of its data, and `data`: one
        `StreamEvent` as JSON on one line.

        Reconnect with `Last-Event-ID` to receive what you missed. When that position
        is too old to replay, the first event is `reset`: fetch `/status` again and
        continue from the `event_id` it reports. A comment line is sent every 25
        seconds to keep the connection open; `retry` tells the client how long to
        wait before reconnecting.
      parameters:
        - name: Last-Event-ID
          in: header
          description: The `id` of the last event received.
          schema: {type: string}
        - name: project_id
          in: query
          description: Only events of these projects.
          style: form
          explode: false
          schema:
            type: array
            items: {$ref: '#/components/schemas/Id'}
      responses:
        '200':
          description: The stream. Each event's `data` is a `StreamEvent`.
          content:
            text/event-stream:
              schema:
                type: string
                description: 'Lines of `id:`, `event:` and `data:`, as in the HTML Living Standard.'
              example: |
                id: 18442
                event: check.updated
                data: {"type":"check.updated","check":{"id":"chk_01HZY8","name":"nightly-backup","state":"up"}}

        '401': {$ref: '#/components/responses/Unauthorized'}

components:

  securitySchemes:
    probeKey:
      type: http
      scheme: bearer
      description: A probe's own key, from `allstill admin create-probe`. It is good for the probe's two endpoints only.
    bearer:
      type: http
      scheme: bearer
      description: |
        An OAuth access token of a person, or, once they are served, a project API key.
        The scopes in a
        security requirement are the token scopes an operation needs: `read` or
        `manage`. With `read` it acts as a viewer in every project it can see, whoever
        holds it, so it never reads a whole address. Each credential has a limit on
        requests a minute, answered with 429 and `Retry-After`.

  parameters:
    ProbeProtocol:
      name: Allstill-Probe-Protocol
      in: header
      required: true
      description: The protocol version the probe speaks. Another than the server's is refused with what to update.
      schema: {type: integer, minimum: 1}
    CheckUuid:
      name: check_uuid
      in: path
      required: true
      description: The check's ping UUID, from its ping URL.
      schema: {type: string, format: uuid}
    PingKey:
      name: ping_key
      in: path
      required: true
      description: The project's ping key, for pings by slug.
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{22}$'
    Slug:
      name: slug
      in: path
      required: true
      description: |
        The check's slug, unique in its project. `start`, `fail` and `log` are not
        allowed as slugs.
      schema: {$ref: '#/components/schemas/Slug'}
    ExitStatus:
      name: exit_status
      in: path
      required: true
      description: The job's exit status. `0` is success, `1` to `255` failure.
      schema:
        type: integer
        minimum: 0
        maximum: 255
    RunId:
      name: rid
      in: query
      description: |
        A UUID the job chooses per run, to pair a start with its end when runs
        overlap, or when the end arrives first: a start within the grace period
        after the end with the same `rid` joins that run instead of starting
        one. Without a `rid`, a start joins the latest run if that is an end
        that came without a start, within the ten seconds before it, and no
        other start has joined it. A start that joins opens no run, so it cannot
        time out; the check's schedule still applies. `allstill run` sets it.
      schema: {type: string, format: uuid}
    Values:
      name: v
      in: query
      description: |
        A value measured by the job, as `name:number`, for example `v=size:18400000000`.
        Repeat for more values. Names are lower case; numbers are plain decimals.
        A check's rules judge these values.
      style: form
      explode: true
      schema:
        type: array
        maxItems: 32
        items:
          type: string
          pattern: '^[a-z][a-z0-9_]{0,63}:-?[0-9]{1,15}(\.[0-9]{1,6})?$'
    ValuesHeader:
      name: Allstill-Values
      in: header
      description: |
        The same values as a Structured Field dictionary (RFC 9651), for example
        `size=18400000000, rows=312`. Values in the query win over values here.
      schema: {type: string}
    Create:
      name: create
      in: query
      description: |
        With `1`, a ping by slug to a check that does not exist yet creates it, with
        the project's defaults. Without it, such a ping gets `404`.
      schema:
        type: integer
        enum: [0, 1]
    ProjectId:
      name: project_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Id'}
    CheckId:
      name: check_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Id'}
    ChannelId:
      name: channel_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Id'}
    Cursor:
      name: cursor
      in: query
      description: The `next_cursor` of the previous page.
      schema: {type: string}
    Limit:
      name: limit
      in: query
      description: The most items on one page.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    IfMatch:
      name: If-Match
      in: header
      description: The ETag of the version you are changing, or `*` for any version.
      schema: {type: string}

  headers:
    ETag:
      description: The version of the resource, for `If-Match`.
      schema: {type: string}
    PingBodyLimit:
      description: The largest request body, in bytes, that is stored; the rest is cut off.
      schema: {type: integer}
    RetryAfter:
      description: Seconds to wait before trying again.
      schema: {type: integer}

  requestBodies:
    PingBody:
      description: |
        The job's output, stored as the run's log up to `Ping-Body-Limit` bytes.
        Any content type is accepted and stored as text.
      content:
        '*/*':
          schema: {type: string}

  responses:
    OAuthError:
      description: RFC 6749's and RFC 8628's way of saying no, or not yet.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/OAuthError'}
    ProbeProblem:
      description: Why the server refused the probe.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    PingOk:
      description: |
        Received. A check pinged far more than once a second has its extra
        pings dropped; by UUID the answer is then still 200, with the text
        `OK (rate limited)`, as on hc-ping.com, so a script that checks the
        status does not start failing.
      headers:
        Ping-Body-Limit: {$ref: '#/components/headers/PingBodyLimit'}
      content:
        text/plain:
          schema: {type: string, enum: ['OK', 'OK (rate limited)']}
    PingCreated:
      description: |
        Received, and the check was created first (`create=1`). A project
        with 1000 checks gets no more from pings; the answer is then 404.
      headers:
        Ping-Body-Limit: {$ref: '#/components/headers/PingBodyLimit'}
      content:
        text/plain:
          schema: {type: string, const: 'Created'}
    PingBadRequest:
      description: The ping is not valid, such as a malformed `rid` or value.
      content:
        text/plain:
          schema: {type: string}
    PingNotFound:
      description: No check has this UUID, or this project has no check with this slug.
      content:
        text/plain:
          schema: {type: string, const: 'not found'}
    PingRateLimited:
      description: |
        A check pinged by slug far more than once a second: the ping was
        dropped. Bursts of 60 pass, then one a second.
      headers:
        Retry-After: {$ref: '#/components/headers/RetryAfter'}
      content:
        text/plain:
          schema: {type: string, const: 'rate limit exceeded'}
    BadRequest:
      description: The request is malformed.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Unauthorized:
      description: No valid token.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Forbidden:
      description: The token's scope or the caller's role does not allow this.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    NotFound:
      description: It does not exist, or the caller may not see it.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    TooManyRequests:
      description: This credential asked too often. Try again after `Retry-After` seconds.
      headers:
        Retry-After: {$ref: '#/components/headers/RetryAfter'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Conflict:
      description: It conflicts with something that exists, such as a slug in use.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    PreconditionFailed:
      description: The resource changed since the ETag in `If-Match`.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Unprocessable:
      description: The request is well-formed but its values are not valid together.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}

  schemas:

    Id:
      type: string
      description: An opaque identifier. Never a secret.
      minLength: 1
      maxLength: 64

    Slug:
      type: string
      pattern: '^[a-z0-9][a-z0-9_-]{0,99}$'

    TimeOfDay:
      type: string
      description: Local time as `HH:MM`, 24-hour clock.
      pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'

    Weekday:
      type: string
      enum: [mon, tue, wed, thu, fri, sat, sun]

    Problem:
      type: object
      description: Problem Details (RFC 9457).
      required: [title, status]
      properties:
        type:
          type: string
          format: uri-reference
          description: Identifies the kind of problem; `about:blank` when nothing more specific.
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        instance: {type: string, format: uri-reference}
        errors:
          type: array
          description: Which fields are wrong, for validation problems.
          items:
            type: object
            required: [pointer, detail]
            properties:
              pointer:
                type: string
                description: A JSON Pointer (RFC 6901) into the request body.
              detail: {type: string}

    Role:
      type: string
      enum: [viewer, editor, owner]

    Scope:
      type: string
      enum: [read, manage]

    OAuthError:
      type: object
      required: [error]
      properties:
        error:
          description: |
            `authorization_pending`, `slow_down`, `access_denied`, `expired_token`,
            `invalid_grant`, `invalid_client`, `invalid_scope`, `invalid_request`,
            `unsupported_grant_type` or `too_many_requests`.
          type: string
        error_description: {type: string}

    Me:
      type: object
      required: [kind, scopes, projects, server_version]
      properties:
        server_version:
          description: The version of the program answering, so a command line can say when the two differ.
          type: string
        sign_in: {$ref: '#/components/schemas/MeSignIn'}
        key: {$ref: '#/components/schemas/MeKey'}
        kind:
          type: string
          enum: [person, api_key]
        person: {$ref: '#/components/schemas/MePerson'}
        scopes:
          type: array
          items: {$ref: '#/components/schemas/Scope'}
        projects:
          type: array
          items: {$ref: '#/components/schemas/MeProject'}
        teams:
          description: |
            The teams the person is in, with their role in each, which is their role
            in every project the team owns. Left out for a key.
          type: array
          items: {$ref: '#/components/schemas/MeTeam'}

    MeTeam:
      type: object
      required: [id, name, role]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        name: {type: string}
        role: {$ref: '#/components/schemas/Role'}

    Team:
      type: object
      description: |
        The team a project belongs to. Given only to a member of that team: someone
        with a role of their own in one project does not learn the team from it.
      required: [id, name]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        name: {type: string}

    MeSignIn:
      type: object
      description: Present when a person is signed in, naming the sign-in this request came through.
      required: [id, name]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        name: {type: string}

    MeKey:
      type: object
      description: Present when a project's key is asking, naming it.
      required: [id, name]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        name: {type: string}

    MePerson:
      type: object
      description: Present when a person is signed in.
      required: [id, name]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        name: {type: string}
        email: {type: string}
        workspace_admin:
          description: |
            The person keeps the installation: its people, its mail and its teams.
            It gives no project. What they may see is in `projects`, as for anyone.
          type: boolean

    MeProject:
      type: object
      required: [id, name, role]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        name: {type: string}
        role: {$ref: '#/components/schemas/Role'}
        team: {$ref: '#/components/schemas/Team'}

    QuietHours:
      type: object
      description: When the person may not be disturbed, except by checks marked critical.
      required: [time_zone, periods]
      properties:
        time_zone: {type: string, description: An IANA time zone name.}
        periods:
          type: array
          items:
            type: object
            required: [days, start, end]
            properties:
              days:
                type: array
                items: {$ref: '#/components/schemas/Weekday'}
              start: {$ref: '#/components/schemas/TimeOfDay'}
              end: {$ref: '#/components/schemas/TimeOfDay'}

    CheckState:
      type: string
      description: |
        - `new`: never pinged.
        - `up`: ran on time and every rule passed.
        - `warning`: ran, with something to warn of, such as a job that says so or a certificate near its end.
        - `late`: overdue, within its grace period.
        - `down`: failed, or overdue past its grace period.
        - `paused`: paused by someone, until resumed or pinged.
        - `unknown`: Allstill cannot tell, such as right after Allstill itself was down.
      enum: [new, up, warning, late, down, paused, unknown]

    StateCounts:
      type: object
      description: How many checks are in each state; states with none are left out.
      additionalProperties:
        type: integer
        minimum: 0
      propertyNames:
        $ref: '#/components/schemas/CheckState'

    Project:
      type: object
      required: [id, name, role, counts]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        name: {type: string}
        role: {$ref: '#/components/schemas/Role'}
        team: {$ref: '#/components/schemas/Team'}
        counts: {$ref: '#/components/schemas/StateCounts'}
        worst_state:
          $ref: '#/components/schemas/CheckState'
          description: Left out for a project with no checks.

    ProjectPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Project'}
        next_cursor: {type: string}

    Schedule:
      description: When a check expects to be pinged.
      oneOf:
        - $ref: '#/components/schemas/IntervalSchedule'
        - $ref: '#/components/schemas/CronSchedule'
      discriminator:
        propertyName: kind
        mapping:
          interval: '#/components/schemas/IntervalSchedule'
          cron: '#/components/schemas/CronSchedule'

    IntervalSchedule:
      type: object
      required: [kind, every]
      properties:
        kind: {type: string, const: interval}
        every:
          type: integer
          format: int64
          minimum: 60
          description: Seconds between pings.

    CronSchedule:
      type: object
      required: [kind, expression, time_zone]
      properties:
        kind: {type: string, const: cron}
        expression:
          type: string
          description: A cron expression with five fields, as in crontab.
          examples: ['0 3 * * *']
        time_zone:
          type: string
          description: An IANA time zone name, such as `Europe/Amsterdam`.

    HttpCheck:
      type: object
      description: |
        An HTTP request Allstill makes itself, on its interval: each attempt is a run,
        with the status code (`status`), how long it took in milliseconds (`ms`) and
        the days the certificate has left (`cert_days`) in its `values`, and why it
        failed or warned in its `reason`. The check is down after `fail_after` failed
        attempts in a row, and up on the first that passes.
      required: [url]
      properties:
        url:
          type: string
          format: uri
          maxLength: 2000
          description: |
            What it fetches, http or https, without a user name or password. A token
            in its path or query is a secret, as a ping URL is: it is whole only for
            an editor or owner of the check's project, or
            a project API key with the `manage` scope; everyone else, and anything
            with the `read` scope, gets its scheme and host alone, such as
            `https://shop.example.com`.
        method:
          type: string
          enum: [GET, HEAD]
          default: GET
        expected_status:
          type: array
          description: Status codes that count as up. Default any 2xx, or any 3xx with `location`.
          maxItems: 20
          items: {type: integer, minimum: 100, maximum: 599}
        json_field:
          type: object
          description: A field in a JSON body that must equal a value, such as a health endpoint's status.
          required: [pointer, equals]
          properties:
            pointer:
              type: string
              maxLength: 200
              description: A JSON Pointer (RFC 6901), such as `/status`.
            equals:
              type: string
              maxLength: 200
              description: The value, as a string; a number, `true`, `false` or `null` as JSON writes it. At most 1 MB of a body is read.
        location:
          type: string
          format: uri
          maxLength: 2000
          description: Where a redirect must lead; the answer must be a redirect there. A secret as `url` is, and returned the same way.
        follow_redirects:
          type: boolean
          default: false
          description: Follow up to 5 redirects and judge the last answer. Each hop must be an address the server may reach. Not with `location`.
        timeout:
          type: integer
          minimum: 1
          maximum: 60
          default: 10
          description: Seconds.
        fail_after:
          type: integer
          minimum: 1
          maximum: 100
          default: 2
          description: How many failed attempts in a row make the check down.
        warn_days:
          type: integer
          minimum: 0
          maximum: 365
          default: 14
          description: |
            Every attempt over TLS reads the certificate. The check is in warning when
            fewer days than this are left, or less than a third of its lifetime when
            that is shorter, and the digest lists it. 0 turns warnings off.
        fail_days:
          type: integer
          minimum: 0
          maximum: 365
          default: 3
          description: An attempt fails when fewer days than this are left, or less than a tenth of the certificate's lifetime when that is shorter. 0 turns it off.
        ca:
          type: string
          maxLength: 65536
          description: Certificates in PEM to trust beyond the system's, such as an internal CA's. Returned only with a whole `url`.
        no_verify:
          type: boolean
          default: false
          description: Do not verify the certificate, such as a self-signed one; its expiry is still read.
        probe_id:
          $ref: '#/components/schemas/Id'
          description: Run from this probe instead of the server.

    ProbeCheck:
      type: object
      description: A check for a probe to run. `http` or `tcp` holds its settings, by its `kind`.
      required: [id, kind, interval]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        kind: {$ref: '#/components/schemas/CheckKind'}
        interval:
          type: integer
          format: int64
          description: Seconds between attempts.
        revision:
          type: string
          description: Names its settings. Send it back with each run, so a run made under older settings does not count.
        http: {$ref: '#/components/schemas/HttpCheck'}
        tcp: {$ref: '#/components/schemas/TcpCheck'}

    ProbeChecks:
      type: object
      required: [protocol, server_time, checks]
      properties:
        protocol:
          type: integer
          description: The protocol version the server speaks.
        server_time: {type: string, format: date-time}
        checks:
          type: array
          items: {$ref: '#/components/schemas/ProbeCheck'}

    ProbeRun:
      type: object
      description: One attempt of a check.
      required: [id, check_id, outcome, ended_ago]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
          description: Unique to the probe, so a batch sent twice counts once.
        check_id: {$ref: '#/components/schemas/Id'}
        revision:
          type: string
          description: The check's `revision` the attempt was made under. A run under other settings is ignored.
        outcome:
          type: string
          description: '`unjudged` when the probe could not tell, as when its own network was down.'
          enum: [passed, warned, failed, unjudged]
        reason:
          type: string
          maxLength: 500
        ended_ago:
          type: integer
          format: int64
          minimum: 0
          description: How many seconds before this post it ended, so the probe's clock does not matter. Older than a day is ignored.
        values:
          type: object
          description: What it measured, as in `HttpCheck` and `TcpCheck`.
          maxProperties: 10
          additionalProperties: {type: number, format: double}

    ProbeRunBatch:
      type: object
      required: [sent_at, runs]
      properties:
        sent_at:
          type: string
          format: date-time
          description: The probe's clock, compared with the server's.
        runs:
          type: array
          maxItems: 500
          items: {$ref: '#/components/schemas/ProbeRun'}

    ProbeRunResult:
      type: object
      required: [server_time, applied, ignored]
      properties:
        server_time: {type: string, format: date-time}
        applied:
          type: integer
          description: Runs that counted.
        ignored:
          type: integer
          description: Runs seen before, too old, not valid, under older settings, or not for this probe's checks.
        clock_off:
          type: integer
          format: int64
          description: Seconds the probe's clock is ahead of the server's, or behind when negative, when that is more than a minute and its runs did not count for it.

    TcpCheck:
      type: object
      description: |
        A connection Allstill makes itself, on its interval: each attempt is a run, with
        how long it took in milliseconds (`ms`) and, with `tls`, the days the certificate
        has left (`cert_days`) in its `values`, and why it failed or warned in its
        `reason`. Nothing is sent over the connection. The check is down after
        `fail_after` failed attempts in a row, and up on the first that passes. Its host
        and port are shown to everyone who can see the check.
      required: [host, port]
      properties:
        host:
          type: string
          maxLength: 253
          description: A host name or IP address, without a scheme or a port.
        port:
          type: integer
          minimum: 1
          maximum: 65535
        tls:
          type: boolean
          default: false
          description: |
            Also finish a TLS handshake, and judge its certificate as `HttpCheck` does.
            STARTTLS, as on mail ports 25 and 587, is not covered. `warn_days`,
            `fail_days`, `ca` and `no_verify` need it.
        timeout:
          type: integer
          minimum: 1
          maximum: 60
          default: 10
          description: Seconds.
        fail_after:
          type: integer
          minimum: 1
          maximum: 100
          default: 2
          description: How many failed attempts in a row make the check down.
        warn_days:
          type: integer
          minimum: 0
          maximum: 365
          default: 14
          description: As in `HttpCheck`.
        fail_days:
          type: integer
          minimum: 0
          maximum: 365
          default: 3
          description: As in `HttpCheck`.
        ca:
          type: string
          maxLength: 65536
          description: As in `HttpCheck`.
        no_verify:
          type: boolean
          default: false
          description: As in `HttpCheck`.
        probe_id:
          $ref: '#/components/schemas/Id'
          description: Run from this probe instead of the server.

    Alerting:
      type: object
      description: How a problem with this check reaches people. The project's routing says who. Returned only to those who may change it.
      properties:
        urgency:
          type: string
          description: |
            `now` alerts people's phones, `digest` waits for the morning digest, `none`
            shows the problem but never alerts, for a machine that is often off.
          enum: [now, digest, none]
          default: now
        critical:
          type: boolean
          default: false
          description: Breaks through people's quiet hours.

    CheckKind:
      type: string
      description: |
        `ping` for a check jobs ping, `http` and `tcp` for one Allstill runs itself.
        Clients show kinds they do not know by name: more will come.
      enum: [ping, http, tcp]

    CheckSettings:
      type: object
      description: What a check is and how it is judged; the part a client can change.
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        slug: {$ref: '#/components/schemas/Slug'}
        description: {type: string, maxLength: 2000}
        tags:
          type: array
          items: {type: string, maxLength: 50}
          maxItems: 20
        kind: {$ref: '#/components/schemas/CheckKind'}
        schedule: {$ref: '#/components/schemas/Schedule'}
        grace:
          type: integer
          format: int64
          minimum: 60
          description: Seconds after the expected time before a check is down.
        http: {$ref: '#/components/schemas/HttpCheck'}
        tcp: {$ref: '#/components/schemas/TcpCheck'}
        alerting: {$ref: '#/components/schemas/Alerting'}

    CheckInput:
      description: |
        A new check. `http` is required for `kind: http` and `tcp` for `kind: tcp`,
        whose schedule is an interval of 60 seconds to a day.
      allOf:
        - $ref: '#/components/schemas/CheckSettings'
        - type: object
          required: [name, kind]
          properties:
            name: {type: string, minLength: 1, maxLength: 200}
            kind: {$ref: '#/components/schemas/CheckKind'}

    CheckPatch:
      description: |
        Fields to change; those left out stay as they are. `http` or `tcp`, when sent,
        replaces what the check runs as a whole, including `probe_id`, so read it first
        and send it with `If-Match`. An empty `slug`, `description` or `tags` clears it.
        A check's `kind` does not change.
      $ref: '#/components/schemas/CheckSettings'

    Check:
      allOf:
        - $ref: '#/components/schemas/CheckSettings'
        - type: object
          required: [id, project_id, name, kind, state, state_since, created_at]
          properties:
            id: {$ref: '#/components/schemas/Id'}
            name: {type: string, minLength: 1, maxLength: 200}
            kind: {$ref: '#/components/schemas/CheckKind'}
            project_id: {$ref: '#/components/schemas/Id'}
            state: {$ref: '#/components/schemas/CheckState'}
            state_since: {type: string, format: date-time}
            state_reason:
              type: string
              description: Why it is in this state, in a short sentence, such as `The job failed with exit status 3.`
            last_ping_at: {type: string, format: date-time}
            next_expected_at: {type: string, format: date-time}
            probe_name:
              type: string
              description: The name of the probe that runs it, if any.
            last_run: {$ref: '#/components/schemas/Run'}
            created_at: {type: string, format: date-time}

    CheckWithPingUrl:
      description: A check, as it is answered only when its ping URL is replaced.
      allOf:
        - $ref: '#/components/schemas/Check'
        - type: object
          required: [ping_url]
          properties:
            ping_url:
              type: string
              format: uri
              description: |
                The check's secret ping URL. Anyone holding it can ping the check, so
                nothing else carries it but this, `createCheck` and `getPingUrl`.

    CheckTry:
      type: object
      description: |
        What one attempt found when an address was added or changed. A try is no run: it
        counts for nothing. `result` says how it went, or `not_tried` with `why_not`.
      required: [result]
      properties:
        result:
          type: string
          description: Clients show results they do not know as they are.
          enum: [up, warning, fails, not_tried]
        why_not:
          type: string
          description: |
            `probe`: only the probe that runs it can try the address. `limit`: this
            credential has made its tries for this minute. `unavailable`: this server
            cannot try anything now.
          enum: [probe, limit, unavailable]
        reason: {type: string, description: 'Why it failed or warned, in a short sentence.'}
        http_status: {type: integer}
        ms: {type: integer, format: int64, description: How long it took.}
        cert_days: {type: number, format: double, description: The days its certificate has left.}
        first_attempt_at:
          type: string
          format: date-time
          description: By when its first real attempt comes. Left out while it is paused.
        alerts_nobody_yet:
          type: boolean
          description: It has never worked, so it alerts nobody until it has.

    CheckTried:
      description: A check that was just changed.
      allOf:
        - $ref: '#/components/schemas/Check'
        - type: object
          properties:
            try: {$ref: '#/components/schemas/CheckTry'}
            same_name:
              type: boolean
              description: Another check in this project has the same name, which is allowed.

    CheckCreated:
      description: A check that was just made.
      allOf:
        - $ref: '#/components/schemas/CheckTried'
        - type: object
          properties:
            ping_url:
              type: string
              format: uri
              description: |
                The check's secret ping URL, if jobs ping it. Anyone holding it can ping
                the check, so nothing else carries it but this, `rotatePingUrl` and
                `getPingUrl`.

    CheckPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Check'}
        next_cursor: {type: string}

    RunOutcome:
      type: string
      enum: [running, success, warning, fail, timeout]

    Run:
      type: object
      description: One run of a job, from its start ping (if any) to its end, or one attempt of a check Allstill runs itself.
      required: [id, check_id, outcome]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        check_id: {$ref: '#/components/schemas/Id'}
        outcome: {$ref: '#/components/schemas/RunOutcome'}
        started_at: {type: string, format: date-time}
        ended_at: {type: string, format: date-time}
        run_time:
          type: integer
          format: int64
          description: Seconds, when both start and end are known.
        exit_status: {type: integer, minimum: 0, maximum: 255}
        values:
          type: object
          description: The values a job sent, or what an attempt measured (see `HttpCheck` and `TcpCheck`).
          additionalProperties: {type: number, format: double}
        reason:
          type: string
          description: Why an attempt failed or warned, in plain words, such as `HTTP 503` or `certificate expires in 12 days`. It never holds the check's URL.

    RunPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Run'}
        next_cursor: {type: string}

    IncidentState:
      type: string
      enum: [open, acknowledged, resolved]

    Incident:
      type: object
      description: |
        One problem, with the checks it touches. Shown per caller: checks in
        projects the caller cannot see are left out, and `cause_hidden` says the
        cause is among them.
      required: [id, title, state, opened_at, checks]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        title: {type: string, examples: ['shop.example.com is down']}
        state: {$ref: '#/components/schemas/IncidentState'}
        urgency:
          type: string
          description: |
            How fast it reaches people, from its cause's Alerting: `now`, `digest`, or
            `none`, shown but never sent. Clients should expect new values.
          enum: [now, digest, none]
        opened_at: {type: string, format: date-time}
        recovering_since:
          type: string
          format: date-time
          description: |
            Its checks are back up since then. It stays open until they have stayed
            up for the settle period, so a check that flaps stays in one incident.
        resolve_reason:
          type: string
          description: Why it resolved. Clients should expect new values.
          enum: [recovered, paused, deleted]
        acknowledged_at: {type: string, format: date-time}
        acknowledged_by: {type: string, description: The name of who acknowledged it.}
        resolved_at: {type: string, format: date-time}
        snoozed_until:
          type: string
          format: date-time
          description: Until when the caller's own alerts for it are held.
        cause_check_id:
          $ref: '#/components/schemas/Id'
          description: The check that most likely caused the others, when the caller may see it.
        cause_hidden:
          type: boolean
          description: The likely cause is a check the caller may not see.
        checks:
          type: array
          items:
            type: object
            required: [id, name, project_id, state]
            properties:
              id: {$ref: '#/components/schemas/Id'}
              name: {type: string}
              project_id: {$ref: '#/components/schemas/Id'}
              state: {$ref: '#/components/schemas/CheckState'}

    Status:
      type: object
      required: [generated_at, overall, counts, projects, attention]
      properties:
        generated_at: {type: string, format: date-time}
        overall:
          type: string
          description: |
            `incident` when a check is down, `attention` when one is late or has a warning,
            `unknown` when nothing is wrong but a check cannot be judged, and `all_still`
            otherwise.
          enum: [all_still, attention, incident, unknown]
        counts: {$ref: '#/components/schemas/StateCounts'}
        projects:
          type: array
          items: {$ref: '#/components/schemas/Project'}
        attention:
          type: array
          description: Every check that is down, late or has a warning, by project and then by name.
          items: {$ref: '#/components/schemas/AttentionCheck'}

    AttentionCheck:
      type: object
      required: [id, name, project_id, project_name, state, state_since]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        name: {type: string}
        project_id: {$ref: '#/components/schemas/Id'}
        project_name: {type: string}
        state: {$ref: '#/components/schemas/CheckState'}
        state_since: {type: string, format: date-time}
        state_reason: {type: string}

    LogParty:
      type: object
      description: |
        Who acted or whom an entry concerns, as far as the reader may know. `kind` is
        `person`, `key`, `probe`, `job`, `command` or `allstill`; or, for someone the
        reader may not know by name, `team`, `administrator`, `outside` or, later,
        `former_member`. A person's `id` is what to narrow to them with.
      required: [kind]
      properties:
        kind: {type: string}
        id: {$ref: '#/components/schemas/Id'}
        name: {type: string}

    LogEntry:
      type: object
      required: [id, at, recorded_at, kind, by]
      properties:
        id: {type: integer, format: int64}
        at:
          type: string
          format: date-time
          description: When it happened.
        recorded_at:
          type: string
          format: date-time
          description: When Allstill learned of it, which a probe can make later.
        project_id: {$ref: '#/components/schemas/Id'}
        project_name:
          type: string
          description: Its name at the time.
        kind:
          type: string
          description: Such as `check.state` or `token.made`. New kinds will come.
        about_kind: {type: string}
        about_id: {$ref: '#/components/schemas/Id'}
        about_name:
          type: string
          description: Its name at the time, so a check that was deleted can still be read.
        by: {$ref: '#/components/schemas/LogParty'}
        person: {$ref: '#/components/schemas/LogParty'}
        group:
          type: string
          description: When this entry stands for several, what to ask for to read them.
        details:
          type: object
          description: What this kind of entry says, in its own fields, none of them promised.
          additionalProperties: true

    LogPage:
      type: object
      required: [items, kept_for]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/LogEntry'}
        next_cursor: {type: string}
        started_at:
          type: string
          format: date-time
          description: When Allstill began keeping this; nothing before it is here.
        kept_for:
          type: integer
          format: int64
          description: How long entries are kept, in seconds.

    ApiKey:
      type: object
      required: [id, project_id, name, scope, made_by, created_at]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        project_id: {$ref: '#/components/schemas/Id'}
        name: {type: string}
        scope: {$ref: '#/components/schemas/Scope'}
        made_by: {$ref: '#/components/schemas/LogParty'}
        made_via:
          type: string
          description: The sign-in it was made through, for an owner of the project's team or the one who made it.
        created_at: {type: string, format: date-time}
        last_used_at: {type: string, format: date-time}

    ApiKeyMade:
      description: A key that was just made. Its value is shown here and never again.
      allOf:
        - $ref: '#/components/schemas/ApiKey'
        - type: object
          required: [key]
          properties:
            key:
              type: string
              description: The key's value, a secret. Only its hash is kept.

    ApiKeyList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/ApiKey'}

    Probe:
      type: object
      required: [id, name, project_id]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        name: {type: string}
        project_id:
          $ref: '#/components/schemas/Id'
          description: A project it serves that the caller may edit.

    ProbeList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: One item per project a probe serves.
          items: {$ref: '#/components/schemas/Probe'}

    Health:
      type: object
      required: [status, sender_behind]
      properties:
        status:
          type: string
          description: '`ok`, `behind` when the sender lags more than two minutes, `offline` when the server cannot judge the checks it runs because its own network is down, `error` when the database cannot be read. The HTTP status says whether all is well: a monitor need not know the values, and a client treats one it does not know as not well.'
          enum: [ok, behind, offline, error]
        sender_behind:
          type: integer
          format: int64
          description: How many seconds the sender lags behind what it should have done; 0 when it keeps up or, with `error`, cannot tell.

    Channel:
      type: object
      description: Where a person is alerted. A push channel never shows its endpoint or keys.
      required: [id, kind, name, state, created_at]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        kind:
          type: string
          description: '`webpush` for a browser or Home Screen app, `email` for an address. Clients show kinds they do not know by name.'
          enum: [webpush, email]
        name: {type: string, description: 'The device, such as "iPhone, Safari"; for an email address, `Email`.'}
        address:
          type: string
          format: email
          description: For `email`, the address. It is the person's own, so it is shown to them.
        state:
          type: string
          description: |
            `confirmed` once a test message was opened on it; `unconfirmed` until then;
            `failing` when alerts to it failed since; `renew` when it subscribed for an
            older key and must be opened on the device to subscribe again. Clients treat
            states they do not know as `unconfirmed`.
          enum: [confirmed, unconfirmed, failing, renew]
        created_at: {type: string, format: date-time}
        confirmed_at: {type: string, format: date-time}
        failed_at: {type: string, format: date-time}

    PushSubscription:
      type: object
      description: A browser's PushSubscription as `toJSON()` gives it, with a name for the device.
      required: [endpoint, keys]
      properties:
        name: {type: string, maxLength: 100}
        key:
          type: string
          description: The VAPID public key the browser subscribed for, base64url; the installation's current one when left out.
        endpoint: {type: string, format: uri, maxLength: 1024, description: An https address at the browser's push service.}
        keys:
          type: object
          required: [p256dh, auth]
          properties:
            p256dh: {type: string, description: 'The browser''s P-256 public key, base64url.'}
            auth: {type: string, description: 'The 16-octet authentication secret, base64url.'}

    Message:
      type: object
      description: One message to one person, on one channel when it was sent.
      required: [id, kind, state, items, created_at]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        kind:
          type: string
          description: Clients show kinds they do not know by name.
          enum: [alert, digest, test, notice]
        state:
          type: string
          description: '`shadow` when it was only recorded; `pending` while it is being sent; then `sent` or `failed`. Clients show states they do not know by name.'
          enum: [shadow, pending, sent, failed]
        channel_id: {$ref: '#/components/schemas/Id'}
        items:
          type: array
          items:
            type: object
            required: [what, title]
            properties:
              incident_id: {$ref: '#/components/schemas/Id'}
              what:
                type: string
                description: Clients show values they do not know as plain text.
                enum: [down, recovered, still_open, resolved_unseen, silent_check, warning, notice]
              title: {type: string}
        error: {type: string, description: 'Why it failed, when it did.'}
        created_at: {type: string, format: date-time}
        sent_at: {type: string, format: date-time}

    MessagePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Message'}
        next_cursor: {type: string}

    AlertSettings:
      type: object
      properties:
        shadow:
          type: boolean
          description: When on, every step runs and is recorded, but only test messages and notices are sent. On by default.

    StreamEvent:
      description: The data of one event in `/events`.
      oneOf:
        - $ref: '#/components/schemas/CheckUpdatedEvent'
        - $ref: '#/components/schemas/CheckRemovedEvent'
        - $ref: '#/components/schemas/IncidentEvent'
        - $ref: '#/components/schemas/StatusEvent'
        - $ref: '#/components/schemas/ResetEvent'
      discriminator:
        propertyName: type
        mapping:
          check.updated: '#/components/schemas/CheckUpdatedEvent'
          check.removed: '#/components/schemas/CheckRemovedEvent'
          incident.opened: '#/components/schemas/IncidentEvent'
          incident.updated: '#/components/schemas/IncidentEvent'
          incident.resolved: '#/components/schemas/IncidentEvent'
          status.updated: '#/components/schemas/StatusEvent'
          reset: '#/components/schemas/ResetEvent'

    CheckUpdatedEvent:
      type: object
      description: 'A check changed: its state, its settings or its last run.'
      required: [type, check]
      properties:
        type: {type: string, const: check.updated}
        check: {$ref: '#/components/schemas/Check'}

    CheckRemovedEvent:
      type: object
      description: A check was deleted, or the caller may no longer see it.
      required: [type, check_id]
      properties:
        type: {type: string, const: check.removed}
        check_id: {$ref: '#/components/schemas/Id'}

    IncidentEvent:
      type: object
      required: [type, incident]
      properties:
        type:
          type: string
          enum: [incident.opened, incident.updated, incident.resolved]
        incident: {$ref: '#/components/schemas/Incident'}

    StatusEvent:
      type: object
      description: The overall state or the counts changed.
      required: [type, overall, counts]
      properties:
        type: {type: string, const: status.updated}
        overall:
          type: string
          enum: [all_still, attention, incident, unknown]
        counts: {$ref: '#/components/schemas/StateCounts'}

    ResetEvent:
      type: object
      description: The stream cannot replay from `Last-Event-ID`; fetch `/status` again.
      required: [type]
      properties:
        type: {type: string, const: reset}
